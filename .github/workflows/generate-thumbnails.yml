name: Generate upload thumbnails

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-thumbnails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image processor
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate thumbnails
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source_root = Path("uploads")
          thumbnail_root = Path("uploads_thumbs")
          thumbnail_root.mkdir(parents=True, exist_ok=True)

          if not source_root.exists():
              raise SystemExit(0)

          supported_extensions = {".avif", ".gif", ".jpeg", ".jpg", ".png", ".webp"}

          for source in source_root.rglob("*"):
              if not source.is_file() or source.suffix.lower() not in supported_extensions:
                  continue

              relative_path = source.relative_to(source_root)
              destination = thumbnail_root / relative_path
              destination.parent.mkdir(parents=True, exist_ok=True)

              if destination.exists() and destination.stat().st_mtime >= source.stat().st_mtime:
                  continue

              try:
                  with Image.open(source) as image:
                      image.thumbnail((640, 640), Image.Resampling.LANCZOS)
                      save_kwargs = {}
                      if image.format in {"JPEG", "WEBP"}:
                          save_kwargs = {"optimize": True, "quality": 82}
                      image.save(destination, **save_kwargs)
              except Exception as error:
                  print(f"Skipping {source}: {error}")
          PY

      - name: Remove orphaned thumbnails
        run: |
          if [ ! -d uploads_thumbs ]; then
            exit 0
          fi

          while IFS= read -r thumbnail; do
            source="uploads/${thumbnail#uploads_thumbs/}"
            if [ ! -f "$source" ]; then
              rm "$thumbnail"
            fi
          done < <(find uploads_thumbs -type f)

          find uploads_thumbs -type d -empty -delete

      - name: Commit generated thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uploads_thumbs
          if git diff --cached --quiet; then
            echo "No thumbnail changes."
            exit 0
          fi
          git commit -m "Generate upload thumbnails"
          git push
