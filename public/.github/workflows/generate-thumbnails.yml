name: Generate upload thumbnails

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-thumbnails-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify-fork:
    runs-on: ubuntu-latest
    outputs:
      is_fork: ${{ steps.repository_info.outputs.is_fork }}

    steps:
      - name: Check repository fork status
        id: repository_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          repository_data="$(curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-delay 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}")"

          is_fork="$(jq -r '.fork | tostring' <<< "${repository_data}")"
          echo "is_fork=${is_fork}" >> "${GITHUB_OUTPUT}"

          if [ "${is_fork}" != "true" ]; then
            echo "Repository ${REPOSITORY} is not a fork; skipping thumbnail generation."
          fi

  generate-thumbnails:
    needs: verify-fork
    if: needs.verify-fork.outputs.is_fork == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image processor
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate thumbnails
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source_root = Path("uploads")
          thumbnail_root = Path("uploads_thumbs")
          thumbnail_root.mkdir(parents=True, exist_ok=True)

          if not source_root.exists():
              raise SystemExit(0)

          supported_extensions = {".avif", ".gif", ".jpeg", ".jpg", ".png", ".webp"}

          for source in source_root.rglob("*"):
              if not source.is_file() or source.suffix.lower() not in supported_extensions:
                  continue

              relative_path = source.relative_to(source_root)
              destination = thumbnail_root / relative_path
              destination.parent.mkdir(parents=True, exist_ok=True)

              if destination.exists() and destination.stat().st_mtime >= source.stat().st_mtime:
                  continue

              try:
                  with Image.open(source) as image:
                      image.thumbnail((640, 640), Image.Resampling.LANCZOS)
                      save_kwargs = {}
                      if image.format in {"JPEG", "WEBP"}:
                          save_kwargs = {"optimize": True, "quality": 82}
                      image.save(destination, **save_kwargs)
              except Exception as error:
                  print(f"Skipping {source}: {error}")
          PY

      - name: Remove orphaned thumbnails
        run: |
          if [ ! -d uploads_thumbs ]; then
            exit 0
          fi

          while IFS= read -r thumbnail; do
            source="uploads/${thumbnail#uploads_thumbs/}"
            if [ ! -f "$source" ]; then
              rm "$thumbnail"
            fi
          done < <(find uploads_thumbs -type f)

          find uploads_thumbs -type d -empty -delete

      - name: Commit generated thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uploads_thumbs
          if git diff --cached --quiet; then
            echo "No thumbnail changes."
            exit 0
          fi
          git commit -m "Generate upload thumbnails"
          git push
